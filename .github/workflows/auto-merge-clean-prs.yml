name: Auto Merge Clean Pull Requests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-merge-clean-prs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Merge pull requests without conflicts
    runs-on: ubuntu-latest

    steps:
      - name: Merge clean pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            function unique(values) {
              return [...new Set(values.filter(Boolean))];
            }

            function mentionTargets(pr) {
              const assignees = (pr.assignees || []).map((assignee) => assignee.login);
              const targets = assignees.length ? assignees : [pr.user?.login];
              return unique(targets).map((login) => `@${login}`).join(" ");
            }

            async function commentOnce(issue_number, marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100
              });

              if (comments.some((comment) => comment.body?.includes(marker))) {
                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

            async function getPullWithMergeability(pull_number) {
              let pull;

              for (let attempt = 0; attempt < 6; attempt += 1) {
                const response = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number
                });

                pull = response.data;

                if (pull.mergeable !== null) {
                  return pull;
                }

                await wait(3000);
              }

              return pull;
            }

            async function closeLinkedIssues(pr) {
              const refs = new Set();
              const text = [pr.title || '', pr.body || ''].join('\n');
              const closingPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+([^\n]+)/gi;
              const referencePattern = /(?:(?<owner>[A-Za-z0-9_.-]+)\/(?<repo>[A-Za-z0-9_.-]+))?#(?<number>\d+)/g;
              function addReferences(value) {
                for (const ref of value.matchAll(referencePattern)) {
                  const targetOwner = (ref.groups.owner || owner).toLowerCase();
                  const targetRepo = (ref.groups.repo || repo).toLowerCase();
                  if (targetOwner === owner.toLowerCase() && targetRepo === repo.toLowerCase()) refs.add(Number(ref.groups.number));
                }
              }
              for (const match of text.matchAll(closingPattern)) addReferences(match[1]);
              const titleIssue = (pr.title || '').match(/\(#(?<number>\d+)\)\s*$/);
              if (titleIssue) refs.add(Number(titleIssue.groups.number));
              for (const issue_number of refs) {
                try {
                  const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
                  if (issue.pull_request || issue.state === 'closed') continue;
                  await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'completed' });
                  await github.rest.issues.createComment({ owner, repo, issue_number, body: 'Closed automatically because PR #' + pr.number + ' was merged.' });
                  core.info('Closed linked issue #' + issue_number + ' for PR #' + pr.number + '.');
                } catch (error) {
                  core.warning('Could not close linked issue #' + issue_number + ': ' + error.message);
                }
              }
            }
            async function mergePullRequest(pr) {
              const mergeMethods = ["squash", "merge", "rebase"];
              let lastError;

              for (const merge_method of mergeMethods) {
                try {
                  await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: pr.number,
                    merge_method,
                    sha: pr.head.sha
                  });

                  await closeLinkedIssues(pr);
                  core.info(`Merged PR #${pr.number} using ${merge_method}.`);
                  return true;
                } catch (error) {
                  lastError = error;

                  if (![403, 405, 409, 422].includes(error.status)) {
                    throw error;
                  }
                }
              }

              const marker = `<!-- zkpayroll-auto-merge:merge-blocked:${pr.head.sha} -->`;
              const mentions = mentionTargets(pr);
              const reason = lastError?.message || "GitHub did not allow this pull request to merge.";

              await commentOnce(
                pr.number,
                marker,
                [
                  marker,
                  `${mentions} this PR has no merge conflicts, but GitHub did not allow the bot to merge it.`,
                  "",
                  `Reason: ${reason}`
                ].join("\n")
              );

              return false;
            }

            async function handlePullRequest(candidate) {
              const pr = await getPullWithMergeability(candidate.number);

              if (!pr || pr.state !== "open" || pr.draft) {
                return;
              }

              const mentions = mentionTargets(pr);

              if (pr.mergeable === null) {
                core.info(`Mergeability is still being calculated for PR #${pr.number}.`);
                return;
              }

              if (pr.mergeable === false || pr.mergeable_state === "dirty") {
                const marker = `<!-- zkpayroll-auto-merge:conflicts:${pr.head.sha} -->`;

                await commentOnce(
                  pr.number,
                  marker,
                  [
                    marker,
                    `${mentions} this PR currently has merge conflicts.`,
                    "",
                    "Please resolve the conflicts before it can be merged automatically."
                  ].join("\n")
                );
                return;
              }

              await mergePullRequest(pr);
            }

            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              sort: "updated",
              direction: "asc",
              per_page: 100
            });

            for (const pr of pullRequests) {
              await handlePullRequest(pr);
            }